name = "whatsapp-alpaca-bot"
main = "index.js"
compatibility_date = "2024-12-18"

# 🟢 CONFIGURATION VARIABLES (Safe for Git)
[vars]
ALPACA_PAPER_TRADING = "true" 

# 🔒 DASHBOARD SECRETS NOTE (Do not paste values here, keep them in your Cloudflare dashboard):
# - META_ACCESS_TOKEN
# - WHATSAPP_PHONE_NUMBER_ID
# - WHATSAPP_VERIFY_TOKEN
# - ALPACA_KEY_ID
# - ALPACA_SECRET_KEY

# 🟢 FREE KV STORAGE DATABASE BINDING
[[kv_namespaces]]
binding = "USER_SESSIONS"
id = "b7261f8c0f2b4b098d96b5cbf787cf77"
